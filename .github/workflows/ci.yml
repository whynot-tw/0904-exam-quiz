name: CI

on:
  push:
    branches:
      - build/v0.1
  pull_request:
    branches:
      - build/v0.1

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Run tests
        env:
          CI_DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
        run: |
          if [ -n "$CI_DATABASE_URL" ]; then
            echo "Running the full test suite against the dedicated CI database."
            export DATABASE_URL="$CI_DATABASE_URL"
            pnpm test
          else
            echo "CI_DATABASE_URL is not configured; running the database-independent test suite."
            pnpm vitest run \
              --exclude server/accountDataMerge.test.ts \
              --exclude server/cmsImport.test.ts \
              --exclude server/learningGoal.test.ts \
              --exclude server/permissions.test.ts \
              --exclude server/starredQuestions.test.ts \
              --exclude server/wrongQuestions.test.ts
          fi

      - name: Production build
        run: pnpm build
